<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>品項進階管理 - MOR</title>
  <link rel="stylesheet" href="/static/css/mor.css">
  <style>
    .item-grid { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .item-grid th, .item-grid td { padding: 12px; text-align: left; border-bottom: 1px solid var(--line); }
    .item-grid tr:hover { background: var(--bg); }
    .status-select { padding: 4px; border-radius: 4px; border: 1px solid var(--cloud); }
  </style>
</head>
<body>
  <header>
    <h1>品項進階管理</h1>
    <nav>
      <a href="/">返回預估工作台</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <p>在此設定品項的全局屬性。設定將即時影響預估計算與預算達成率。</p>
      
      <form action="/items/save" method="post">
        <table class="item-grid">
          <thead>
            <tr>
              <th>品項名稱</th>
              <th>納入計算</th>
              <th>納入預算</th>
              <th>顯示於主表</th>
              <th>狀態標籤</th>
            </tr>
          </thead>
          <tbody>
            {% for item in items %}
            <tr>
              <td>
                <strong>{{ item.product_name }}</strong><br>
                <small style="color: var(--slate);">ID: {{ item.product_code }}</small>
                <input type="hidden" name="product_codes" value="{{ item.product_code }}">
              </td>
              <td>
                <input type="checkbox" name="is_excluded_{{ item.product_code }}" value="1" 
                  {% if item.is_excluded %}checked{% endif %}> 排除
              </td>
              <td>
                <input type="checkbox" name="is_budgeted_{{ item.product_code }}" value="1" 
                  {% if item.is_budgeted %}checked{% endif %}> 納入
              </td>
              <td>
                <input type="checkbox" name="is_visible_{{ item.product_code }}" value="1" 
                  {% if item.is_visible %}checked{% endif %}> 顯示
              </td>
              <td>
                <select name="status_label_{{ item.product_code }}" class="status-select">
                  <option value="" {% if not item.status_label %}selected{% endif %}>正常</option>
                  <option value="停用" {% if item.status_label == '停用' %}selected{% endif %}>停用</option>
                  <option value="特殊品項" {% if item.status_label == '特殊品項' %}selected{% endif %}>特殊品項</option>
                  <option value="新上市" {% if item.status_label == '新上市' %}selected{% endif %}>新上市</option>
                </select>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
        
        <div class="bottom-bar">
          <button type="submit" class="primary-btn">儲存所有設定</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
