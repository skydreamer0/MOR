<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>排除品項管理 - MOR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mor.css') }}">
</head>
<body>
  <header>
    <h1>MOR</h1>
    <nav>
      <a href="/">預估工作台</a> |
      <a href="/exclusions">排除品項管理</a>
    </nav>
  </header>

  <main>
    <h2>排除品項管理</h2>
    <p>勾選代表該品項不納入業績、預估、統計計算。</p>

    <form method="post" action="/exclusions/save">
      <div class="forecast-tools">
        <label>
          搜尋品項
          <input type="search" id="item-search" placeholder="輸入品項名稱或代碼" oninput="filterItems()">
        </label>
        <button type="submit">儲存設定</button>
      </div>

      <div class="table-wrap">
        <table id="items-table">
          <thead>
            <tr>
              <th style="width: 50px;">排除</th>
              <th>商品號</th>
              <th>品項名稱</th>
            </tr>
          </thead>
          <tbody>
            {% for item in items %}
            <tr data-item-row data-search="{{ item.product_code }} {{ item.product_name }}">
              <td style="text-align: center;">
                <input type="checkbox" name="excluded_item_ids" value="{{ item.product_code }}" 
                       {% if item.product_code in excluded_item_ids %}checked{% endif %}>
              </td>
              <td>{{ item.product_code }}</td>
              <td>{{ item.product_name }}</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </form>
  </main>

  <script>
    function filterItems() {
      const query = document.getElementById('item-search').value.toLowerCase();
      document.querySelectorAll('[data-item-row]').forEach(row => {
        const text = row.getAttribute('data-search').toLowerCase();
        row.style.display = text.includes(query) ? '' : 'none';
      });
    }
  </script>
</body>
</html>
